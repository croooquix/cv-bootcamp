# 🛍️ Week 4 Multimodal Fashion Search Configuration
#
# paths 항목은 저장소 루트 기준 상대 경로로 적습니다. utils.load_config()가
# 읽는 시점에 절대 경로로 바꾸므로, 어느 디렉토리에서 실행하든 같은 위치를
# 가리킵니다. 절대 경로를 적으면 그 값을 그대로 사용합니다.

paths:
  # 3주차에서 학습한 YOLOv8s 가중치. runs/ 는 Git에서 제외되므로 새로 클론한
  # 환경에는 없고, 그 경우 아래 fallback 모델이 대신 사용됩니다.
  yolo_model_path: "runs/detect/train5/weights/best.pt"
  # 경로가 아니라 ultralytics가 이름으로 받아 내려받는 사전학습 모델입니다.
  yolo_fallback_path: "yolov8n.pt"

  # 인덱싱 대상 데이터셋. week3/data/ 도 Git에서 제외되어 있어
  # week3/src/download_dataset.py 로 먼저 내려받아야 합니다.
  dataset_images_dir: "week3/data/train/images"

  # 인덱스 및 메타데이터 저장 경로
  index_save_path: "week4/index/fashion_index.faiss"
  metadata_save_path: "week4/index/fashion_meta.json"

clip:
  # OpenAI CLIP Model (Hugging Face)
  model_name: "openai/clip-vit-base-patch32"
  embedding_dim: 512

crop:
  # 멘토 피드백 #1: 타이트한 박스로 인한 이미지 잘림 방지 (10% 여백 추가)
  padding_ratio: 0.10

search:
  top_k: 5
  # 멘토 피드백 #2: Faiss 코사인 유사도 검색용 L2 정규화 사용 여부
  normalize_l2: true
